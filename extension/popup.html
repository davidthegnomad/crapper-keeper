<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 280px; padding: 16px; font-family: -apple-system, sans-serif; font-size: 13px; }
        h2 { font-size: 16px; color: #80397b; margin: 0 0 12px; }
        label { display: block; margin-bottom: 2px; color: #444; }
        select { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #ddd; margin-bottom: 8px; font-size: 13px; }
        button { width: 100%; padding: 8px; border-radius: 6px; border: none; background: #80397b; color: #fff; font-weight: 600; cursor: pointer; font-size: 13px; }
        button:hover { background: #a55aa1; }
        button:disabled { opacity: 0.6; cursor: default; }
        .status { margin-top: 8px; font-size: 11px; color: #666; text-align: center; min-height: 14px; }
        .hidden { display: none; }
        a { color: #80397b; text-decoration: none; font-size: 12px; }
        .foot { margin-top: 12px; text-align: center; }
        .link-btn { background: none; color: #80397b; width: auto; padding: 0; font-weight: 400; font-size: 11px; }
        .link-btn:hover { background: none; text-decoration: underline; }
    </style>
</head>
<body>
    <h2>Crapper Keeper</h2>
    <p style="margin:-6px 0 12px;font-size:12px;color:#666;">Get your 💩 together.</p>

    <!-- Signed-out state -->
    <div id="signed-out" class="hidden">
        <p style="color:#555;margin:0 0 12px;">Sign in with Google to pick where saved pages go.</p>
        <button id="btn-signin">Sign in with Google</button>
    </div>

    <!-- Signed-in state -->
    <div id="signed-in" class="hidden">
        <label>Save to notebook:</label>
        <select id="notebook-select"><option>Loading…</option></select>
        <label>Chapter:</label>
        <select id="section-select"><option>Select notebook first</option></select>
        <button id="btn-save">Save Settings</button>
        <div class="foot"><button id="btn-signout" class="link-btn">Sign out</button></div>
    </div>

    <div id="status" class="status"></div>

    <div class="foot">
        <a href="https://davidthegnomadorg.web.app/crapper-keeper/" target="_blank">Open Webapp →</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
