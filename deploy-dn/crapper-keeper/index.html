<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Crapper Keeper</title>
    <meta name="description" content="Get your 💩 together — Crapper Keeper by Gnomad Studio.">
    <meta property="og:title" content="Crapper Keeper">
    <meta property="og:description" content="Get your 💩 together.">
    <meta property="og:image" content="https://davidthegnomadorg.web.app/crapper-keeper/icons/og-1200x630.png">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#2a0a4a">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="./css/app.css">
    <script>try{if(localStorage.getItem('ck-dark')==='1')document.documentElement.classList.add('dark')}catch(e){}</script>
</head>
<body>

    <!-- Sign-in overlay — Gnomad vaporwave -->
    <div id="auth-overlay" style="position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%, #6b2db5 0%, #2a0a4a 55%, #12061f 100%);">
        <div style="text-align:center;padding:40px;max-width:360px;">
            <img src="./icons/icon-192.png" alt="Crapper Keeper" width="96" height="96" style="border-radius:22px;box-shadow:0 0 32px rgba(255,43,214,0.45),0 0 64px rgba(0,229,255,0.2);margin-bottom:20px;">
            <h1 style="font-size:28px;font-weight:700;color:#fff;margin-bottom:8px;text-shadow:0 0 18px rgba(255,43,214,0.55);">Crapper Keeper</h1>
            <p style="font-size:14px;color:rgba(255,255,255,0.72);margin-bottom:24px;">Get your 💩 together.</p>
            <button id="btn-google-signin" style="padding:12px 32px;font-size:14px;font-weight:600;border:none;border-radius:8px;background:#fff;color:#2a0a4a;box-shadow:0 0 24px rgba(0,229,255,0.35);cursor:pointer;display:flex;align-items:center;gap:10px;margin:0 auto 10px;">
                🔵 Sign in with Google
            </button>
            <button id="btn-apple-signin" class="hidden" style="padding:12px 32px;font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,.35);border-radius:8px;background:#000;color:#fff;cursor:pointer;align-items:center;gap:10px;margin:0 auto;">
                 Sign in with Apple
            </button>
            <p id="auth-error" style="display:none;margin-top:16px;font-size:13px;color:#ff8a80;max-width:320px;"></p>
            <p style="margin-top:28px;font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:0.04em;">GNOMAD STUDIO</p>
        </div>
    </div>

    <!-- App shell -->
    <div id="app-shell" style="display:none;flex:1;flex-direction:column;height:100%;">

    <div class="title-bar">
        <button onclick="document.querySelector('.sidebar').classList.toggle('hidden')" title="Toggle sidebar">☰</button>
        <span class="brand">
            <img class="brand-icon" src="./icons/icon-192.png" alt="" width="28" height="28">
            Crapper Keeper
        </span>
        <div class="search-wrapper">
            <span class="search-icon">⌕</span>
            <input type="text" placeholder="Search all notes..." class="search-input">
            <div id="search-results" class="search-results hidden"></div>
        </div>
        <button type="button" id="btn-dark-mode" title="Toggle vaporwave dark mode" aria-pressed="false">◑</button>
        <button title="Export notebook as Markdown" id="btn-export" style="color:rgba(255,255,255,.8);font-size:14px;padding:4px 8px;border-radius:4px;">⬇</button>
        <button title="Account settings" id="btn-account" class="account-action">⚙</button>
    </div>

    <div class="main-content">
        <div class="tk-strip"><div class="tk-tabs-container"></div></div>
        <div class="sidebar" style="padding-left:4px;">
            <div class="sidebar-divider"></div>
            <div class="section-pane-scroll" id="section-pane">
                <div class="sidebar-section-header" style="padding-top:8px;"><span class="sidebar-section-label">Chapters</span></div>
                <div id="section-list"></div>
                <div id="section-add-form"></div>
            </div>
            <div class="sidebar-v-resizer" id="sidebar-v-resizer" title="Drag to resize chapters / pages" role="separator" aria-orientation="horizontal"></div>
            <div class="page-pane-scroll" id="page-pane">
                <div class="sidebar-section-header" style="padding-top:8px;"><span class="sidebar-section-label">Pages</span></div>
                <div id="page-list"></div>
                <div id="page-add-form"></div>
            </div>
            <a class="sidebar-credit" href="https://gnomadstudio.org" target="_blank" rel="noopener noreferrer">Made with ❤️ by Gnomad Studio 🦙</a>
        </div>
        <div class="resizer" id="sidebar-h-resizer" title="Drag to resize sidebar" role="separator" aria-orientation="vertical"></div>
        <div id="editor-pane" class="editor-pane"><div class="empty-state"><div class="empty-inner"><h2>Welcome to Crapper Keeper</h2><p>Loading…</p></div></div></div>
    </div>

    <div class="status-bar">
        <span id="save-status">📶 Connected</span>
        <span id="breadcrumb" class="status-breadcrumb"></span>
    </div>

    <div id="account-menu" class="account-menu hidden" role="dialog" aria-label="Account settings">
        <a class="account-menu-link" href="mailto:support@gnomadstudio.org">📧 Support email</a>
        <a class="account-menu-link" href="https://gnomadstudio.org" target="_blank" rel="noopener noreferrer">Made with ❤️ by Gnomad Studio 🦙</a>
        <div class="account-menu-meta">Crapper Keeper <span id="app-version">v—</span></div>
        <hr class="account-menu-sep">
        <button id="btn-signout">Sign out</button>
        <button id="btn-delete-account" class="danger">Delete account and data</button>
        <button id="btn-account-close">Cancel</button>
    </div>

    </div><!-- end app-shell -->

    <script type="module" src="./js/app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js');
        });
      }
    </script>

</body>
</html>
